CONFIG_CPP=y
CONFIG_STD_CPP17=y
CONFIG_REQUIRES_FULL_LIBCPP=y
# libc: picolibc (Zephyr SDK 1.0 ships no newlib); malloc = Zephyr common libc
# heap over the rest of DRAM (COMMON_LIBC_MALLOC_ARENA_SIZE -1)

CONFIG_PRINTK=y
CONFIG_CONSOLE=y
# printk -> RAM console = remoteproc trace0 (/sys/kernel/debug/remoteproc/*/trace0)
CONFIG_RAM_CONSOLE=y
CONFIG_RAM_CONSOLE_BUFFER_SIZE=61440
CONFIG_LOG=y
CONFIG_LOG_MODE_MINIMAL=y
CONFIG_REBOOT=y

# J721E R5F: TI MPU table at early boot (SOC_TI_K3_R5F_EARLY_MPU), caches on
CONFIG_ARM_MPU=n
CONFIG_CACHE_MANAGEMENT=y
# hard-float ABI with the DP FPU (VFP_DP_D16), shared between threads
CONFIG_FPU=y
CONFIG_FPU_SHARING=y

CONFIG_SPEED_OPTIMIZATIONS=y
CONFIG_SYS_CLOCK_TICKS_PER_SEC=1000
# main at 8: ap_timer (2) and ap_rpmsg (5) preempt it, ap_io and the
# PRIORITY_IO/storage threads run below it (11..12, as in AP_HAL_ChibiOS)
CONFIG_MAIN_THREAD_PRIORITY=8
CONFIG_AP_HAL_ZEPHYR_IO_BELOW_MAIN=y
CONFIG_THREAD_NAME=y
CONFIG_MAIN_STACK_SIZE=65536
# Cortex-R runs every interrupt handler on the SVC-mode stack (isr_wrapper.S),
# nested ones included: the 512 B default is no margin for the timer announce,
# the UART and mailbox handlers and a printk from the shutdown hook
CONFIG_ARMV7_SVC_STACK_SIZE=4096
# stack diagnostics (no MPU stack guard on this core, CONFIG_ARM_MPU=n):
# stacks filled with 0xAA and their bounds recorded, so the monitor can print
# the headroom; a sentinel word at the low end of every thread stack, checked
# at context switches and interrupt exits (a corrupted one is a fatal error
# -> k_sys_fatal_error_handler)
CONFIG_INIT_STACKS=y
CONFIG_THREAD_STACK_INFO=y
CONFIG_STACK_SENTINEL=y
# k_malloc pool (Zephyr-side users); ArduPilot allocates from the newlib heap
# = the rest of DRAM after the image
CONFIG_HEAP_MEM_POOL_SIZE=262144

CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_RING_BUFFER=y
CONFIG_AP_HAL_UART_TX_BUF_SIZE=4096
CONFIG_SPI=y
CONFIG_GPIO=y

# RPMsg to Linux: IPM over the OMAP mailbox, resource table for remoteproc
CONFIG_IPM=y
CONFIG_OPENAMP=y
CONFIG_OPENAMP_MASTER=n
CONFIG_OPENAMP_RSC_TABLE=y
CONFIG_OPENAMP_RSC_TABLE_NUM_RPMSG_BUFF=8

# milestone 1: mock IMU + baro, parameters in RAM (no storage backend)
CONFIG_AP_HAL_ZEPHYR_MOCK_SENSORS=y

# POSIX headers (sys/stat.h for AP_Filesystem, as on BVF); no filesystem yet
CONFIG_POSIX_API=y
# Util::available_memory() from the common libc malloc heap (picolibc toolchain)
CONFIG_SYS_HEAP_RUNTIME_STATS=y

# 1 Hz diagnostics line (+ cpu share per thread, stack headroom every 10 s,
# task table every 30 s) into trace0: the 60 KiB ring holds ~2 minutes; set
# CONFIG_AP_HAL_ZEPHYR_MONITOR_PRINT_EVERY=10 for ~20 minutes
CONFIG_AP_HAL_ZEPHYR_MONITOR=y
# outputs to the safe state when the main loop has not come round for 500 ms
# (outside expect_delay_ms()), checked by the timer thread
CONFIG_AP_HAL_ZEPHYR_MAIN_STUCK_MS=500
# AP_HAL::micros64()/millis64() from the 19.2 MHz DM timer counter (1 us
# resolution; the tick clock is 1 ms)
CONFIG_AP_HAL_ZEPHYR_CYCLE_CLOCK=y
# delay_microseconds(): sleep whole ticks in waits >= 2 ms (the main loop's
# wait for the next IMU sample), busy-wait the last tick and short waits
CONFIG_AP_HAL_ZEPHYR_DELAY_SLEEP_MIN_US=2000
