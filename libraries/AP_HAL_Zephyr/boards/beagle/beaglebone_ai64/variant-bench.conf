# build variant "bench" (always LAST): bench session firmware. Duty capped at 25 %, mock IMU allowed to arm but
# only when no real IMU answers (the real probes come first), announced on the GCS every 30 s. NEVER on a chair
# with motor power on beyond the bench steps that allow it.
CONFIG_AP_HAL_ZEPHYR_MOCK_SENSORS=y
CONFIG_AP_HAL_ZEPHYR_MB_ALLOW_MOCK=y
CONFIG_AP_HAL_ZEPHYR_BENCH_MOCK_FALLBACK=y
CONFIG_AP_HAL_ZEPHYR_MB_DUTY_CAP=2500
